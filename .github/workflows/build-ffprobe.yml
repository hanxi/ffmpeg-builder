name: Build and Push FFmpeg

on:
  push:
    branches: [ main ]
    paths:
      - Dockerfile
      - tests/**
      - .github/workflows/build-ffprobe.yml
  pull_request:
    branches: [ main ]
    paths:
      - Dockerfile
      - tests/**
      - .github/workflows/build-ffprobe.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Install fixture generator
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends ffmpeg

    - name: Build native image for HLS input tests
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: ffmpeg-hls-test:local

    - name: Test built FFmpeg and FFprobe with HLS inputs
      run: python3 tests/hls_input.py --image ffmpeg-hls-test:local

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: hanxi/ffmpeg
        tags: |
          type=ref,event=branch
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
